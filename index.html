<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrera de Calidad Pro & Procesos</title>
    <style>
        :root {
            --primary: #6366F1;
            --primary-dark: #4338CA;
            --secondary: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --bg-dark: #0F172A;
            --card-bg: #1E293B;
            --card-border: #334155;
            --text-light: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 520px; background-color: var(--card-bg); border-radius: 24px; padding: 28px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); position: relative; overflow: hidden; }
        .screen { display: none; flex-direction: column; gap: 20px; }
        .screen.active { display: flex; }
        .header-title { text-align: center; font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #818CF8, #C084FC, #F472B6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; }
        
        .track-container { background-color: #0B1120; border-radius: 16px; padding: 16px; border: 2px solid var(--card-border); position: relative; }
        .track-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 700; }
        .track-bar-bg { height: 28px; background-color: #1E293B; border-radius: 14px; position: relative; overflow: hidden; border: 1px solid #475569; }
        .track-progress { height: 100%; width: 0%; background: linear-gradient(90deg, #10B981, #34D399, #60A5FA); border-radius: 14px; transition: width 0.6s ease; }
        .racer-icon { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 1.8rem; transition: left 0.6s ease; }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        input[type="text"], select { background-color: #0B1120; border: 1px solid var(--card-border); padding: 14px; border-radius: 12px; color: var(--text-light); font-size: 0.95rem; outline: none; }
        
        .avatar-selection { display: flex; justify-content: space-around; margin-top: 6px; }
        .avatar-opt { font-size: 2rem; padding: 10px 14px; border-radius: 16px; cursor: pointer; border: 2px solid transparent; background-color: #0B1120; }
        .avatar-opt.selected { border-color: var(--primary); background-color: #312E81; transform: scale(1.15); }

        .btn { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; padding: 15px; border-radius: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; text-align: center; }
        .btn-outline { background: transparent; border: 2px solid var(--card-border); color: var(--text-muted); }

        .q-meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        .q-card { background-color: #0B1120; padding: 20px; border-radius: 16px; border-left: 5px solid var(--primary); font-size: 1.05rem; font-weight: 600; }
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .opt-btn { background-color: #0B1120; border: 2px solid var(--card-border); padding: 14px; border-radius: 14px; color: var(--text-light); font-size: 0.95rem; text-align: left; cursor: pointer; }
        .opt-btn.correct { border-color: var(--secondary) !important; background-color: #064E3B !important; color: white; }
        .opt-btn.incorrect { border-color: var(--danger) !important; background-color: #7F1D1D !important; color: white; }
        
        .feedback { padding: 12px; border-radius: 12px; font-size: 0.9rem; text-align: center; font-weight: 700; display: none; }
        .feedback.correct { display: block; background-color: rgba(16, 185, 129, 0.15); color: var(--secondary); border: 1px solid var(--secondary); }
        .feedback.incorrect { display: block; background-color: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }

        .stats-card { background-color: #0B1120; border-radius: 16px; padding: 18px; display: flex; justify-content: space-around; border: 1px solid var(--card-border); }
        .stat-val { font-size: 1.4rem; font-weight: 800; color: var(--primary); text-align: center; }
        .stat-lbl { font-size: 0.75rem; color: var(--text-muted); text-align: center; }
        .status-msg { font-size: 0.85rem; text-align: center; color: var(--secondary); font-weight: bold; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; padding: 15px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); border-radius: 20px; padding: 24px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 99; }
        .sound-toggle { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: var(--text-muted); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <button class="sound-toggle" id="sound-btn" onclick="toggleSound()">🔊</button>
        
        <!-- PANTALLA 1: REGISTRO -->
        <div id="screen-welcome" class="screen active">
            <div>
                <h1 class="header-title">Carrera de Calidad Pro</h1>
                <p class="subtitle">Refuerzo Operativo & Evaluación Interactiva</p>
            </div>

            <div class="input-group">
                <label for="player-name">Nombre y Apellido *</label>
                <input type="text" id="player-name" placeholder="Ej. Ana Martínez" required>
            </div>

            <div class="input-group">
                <label for="player-id">Número de Empleado / ID *</label>
                <input type="text" id="player-id" placeholder="Ej. EMP-10482" required>
            </div>

            <div class="input-group">
                <label for="player-role">Área / Campaña</label>
                <select id="player-role">
                    <option value="Agente / Operaciones">Agente / Operaciones</option>
                    <option value="Analista de Calidad">Analista de Calidad</option>
                    <option value="Supervisor / Team Leader">Supervisor / Team Leader</option>
                    <option value="Capacitación / Trainer">Capacitación / Trainer</option>
                </select>
            </div>

            <div class="input-group">
                <label>Selecciona tu Vehículo:</label>
                <div class="avatar-selection">
                    <div class="avatar-opt selected" onclick="selectAvatar(this, '🏎️')">🏎️</div>
                    <div class="avatar-opt" onclick="selectAvatar(this, '🚀')">🚀</div>
                    <div class="avatar-opt" onclick="selectAvatar(this, '🏍️')">🏍️</div>
                    <div class="avatar-opt" onclick="selectAvatar(this, '⚡')">⚡</div>
                </div>
            </div>

            <button class="btn" onclick="startGame()">¡Comenzar Carrera!</button>
            <button class="btn btn-outline" onclick="openQuestionEditor()">⚙️ Personalizar Preguntas</button>
        </div>

        <!-- PANTALLA 2: JUEGO -->
        <div id="screen-game" class="screen">
            <div class="track-container">
                <div class="track-labels">
                    <span>SALIDA</span>
                    <span id="player-display-name">Piloto</span>
                    <span>META 🏁</span>
                </div>
                <div class="track-bar-bg">
                    <div id="track-progress" class="track-progress"></div>
                    <div id="racer-icon" class="racer-icon" style="left: 0%;">🏎️</div>
                </div>
            </div>

            <div class="q-meta">
                <span id="q-number">Pregunta 1/5</span>
                <span id="timer-display">⏱️ 00:00</span>
            </div>

            <div id="q-text" class="q-card">Cargando pregunta...</div>
            <div id="options-container" class="options-grid"></div>
            <div id="feedback" class="feedback"></div>

            <button id="next-btn" class="btn" style="display: none;" onclick="nextQuestion()">Siguiente Avance ➔</button>
        </div>

        <!-- PANTALLA 3: RESULTADOS -->
        <div id="screen-result" class="screen">
            <div style="text-align: center;">
                <div style="font-size: 4rem;">🏆</div>
                <h2>¡Llegaste a la Meta!</h2>
                <p class="subtitle">Evaluación guardada automáticamente</p>
            </div>

            <div class="stats-card">
                <div>
                    <div id="stat-score" class="stat-val">0</div>
                    <div class="stat-lbl">Aciertos</div>
                </div>
                <div>
                    <div id="stat-time" class="stat-val">0s</div>
                    <div class="stat-lbl">Tiempo</div>
                </div>
                <div>
                    <div id="stat-accuracy" class="stat-val">0%</div>
                    <div class="stat-lbl">Precisión</div>
                </div>
            </div>

            <div id="sending-status" class="status-msg">💾 Registrando en Google Sheets...</div>
            <button class="btn" onclick="restartGame()">Volver a Jugar</button>
        </div>
    </div>

    <!-- MODAL EDITOR DE PREGUNTAS -->
    <div id="editor-modal" class="modal">
        <div class="modal-content">
            <h2 style="font-size: 1.3rem; text-align: center;">⚙️ Editor de Preguntas</h2>
            <div id="questions-list-editor" style="display:flex; flex-direction:column; gap:10px;"></div>
            <button class="btn" onclick="saveCustomQuestions()">Guardar y Aplicar</button>
            <button class="btn btn-outline" onclick="resetDefaultQuestions()">Restablecer Originales</button>
            <button class="btn btn-outline" onclick="closeQuestionEditor()">Cancelar</button>
        </div>
    </div>

    <script>
        const DEFAULT_SHEET_URL = "https://script.google.com/macros/s/AKfycbxKBl3dxR-i46MVrV1xImeCCrxV26PHbyI8VOoaqYoY4VLPISIuJWROE265U6m49O1JpQ/exec";

        const baseQuestions = [
            { q: "¿Qué tipo de error se considera cuando un agente proporciona información falsa al cliente?", options: ["Error Fatal de Negocio / Calidad", "Error No Fatal de Formato", "Falta de Habilidades Blandas", "Oportunidad de Mejora Menor"], correct: 0 },
            { q: "Durante una evaluación de llamada, ¿cuál es el objetivo principal del proceso de 'Calibración'?", options: ["Castigar los errores del equipo", "Alinear criterios de evaluación entre analistas y supervisores", "Aumentar la duración media de las llamadas", "Filtrar llamadas cortas"], correct: 1 },
            { q: "Si el cliente demuestra frustración, ¿qué habilidad blanda debe priorizar el agente?", options: ["Empatía y Escucha Activa", "Rapidez para colgar", "Repetir el script sin cambios", "Transferir inmediatamente"], correct: 0 },
            { q: "¿Qué se debe validar obligatoriamente al inicio de la llamada según el protocolo de seguridad?", options: ["La opinión del cliente", "La autenticación e identidad del titular", "La velocidad de conexión", "El historial de compras"], correct: 1 },
            { q: "¿Cuál es la forma correcta de realizar la 'Tipificación' del caso en el CRM?", options: ["Al finalizar la jornada", "Seleccionar la primera opción", "Registrar motivo real y resolución exacta antes de cerrar", "Dejar en blanco"], correct: 2 }
        ];

        let questions = JSON.parse(localStorage.getItem('custom_questions')) || baseQuestions;
        let currentQuestionIdx = 0, score = 0, selectedAvatar = '🏎️';
        let startTime, timerInterval, totalSeconds = 0, playerData = {}, soundEnabled = true;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.15);
                } else if (type === 'incorrect') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(130.81, audioCtx.currentTime + 0.2);
                } else {
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.4);
                }
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }

        function toggleSound() { soundEnabled = !soundEnabled; document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇'; }
        function selectAvatar(el, icon) { document.querySelectorAll('.avatar-opt').forEach(a => a.classList.remove('selected')); el.classList.add('selected'); selectedAvatar = icon; }
        function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

        function startGame() {
            const name = document.getElementById('player-name').value.trim();
            const id = document.getElementById('player-id').value.trim();
            if (!name || !id) return alert("Ingresa tu Nombre y Número de Empleado.");
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            playerData = { name, id, role: document.getElementById('player-role').value };
            document.getElementById('player-display-name').innerText = name.split(' ')[0];
            document.getElementById('racer-icon').innerText = selectedAvatar;
            currentQuestionIdx = 0; score = 0; totalSeconds = 0;
            
            updateTrackPosition(); showScreen('screen-game'); startTimer(); loadQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval); startTime = Date.now();
            timerInterval = setInterval(() => {
                totalSeconds = Math.floor((Date.now() - startTime) / 1000);
                const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
                const s = String(totalSeconds % 60).padStart(2, '0');
                document.getElementById('timer-display').innerText = `⏱️ ${m}:${s}`;
            }, 1000);
        }

        function loadQuestion() {
            const qData = questions[currentQuestionIdx];
            document.getElementById('q-number').innerText = `Pregunta ${currentQuestionIdx + 1}/${questions.length}`;
            document.getElementById('q-text').innerText = qData.q;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn'; btn.innerText = opt;
                btn.onclick = () => selectOption(idx, qData.correct);
                container.appendChild(btn);
            });
        }

        function selectOption(selected, correct) {
            document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
            const fb = document.getElementById('feedback');
            if (selected === correct) {
                document.querySelectorAll('.opt-btn')[selected].classList.add('correct');
                fb.innerText = "¡Excelente! Respuesta Correcta 🚀"; fb.className = "feedback correct";
                score++; playSound('correct'); updateTrackPosition();
            } else {
                document.querySelectorAll('.opt-btn')[selected].classList.add('incorrect');
                document.querySelectorAll('.opt-btn')[correct].classList.add('correct');
                fb.innerText = "Respuesta incorrecta ❌"; fb.className = "feedback incorrect";
                playSound('incorrect');
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        function updateTrackPosition() {
            const pct = (score / questions.length) * 100;
            document.getElementById('track-progress').style.width = `${pct}%`;
            document.getElementById('racer-icon').style.left = `${pct}%`;
        }

        function nextQuestion() {
            currentQuestionIdx++;
            if (currentQuestionIdx < questions.length) loadQuestion();
            else endGame();
        }

        function endGame() {
            clearInterval(timerInterval); showScreen('screen-result');
            const accuracy = Math.round((score / questions.length) * 100);
            document.getElementById('stat-score').innerText = `${score}/${questions.length}`;
            document.getElementById('stat-time').innerText = `${totalSeconds}s`;
            document.getElementById('stat-accuracy').innerText = `${accuracy}%`;
            playSound('win'); triggerConfetti(); sendToGoogleSheet(accuracy);
        }

        function sendToGoogleSheet(accuracy) {
            const statusEl = document.getElementById('sending-status');
            fetch(DEFAULT_SHEET_URL, {
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fecha: new Date().toLocaleString(), nombre: playerData.name, numEmpleado: playerData.id, rol: playerData.role, aciertos: `${score}/${questions.length}`, precision: `${accuracy}%`, tiempo: totalSeconds })
            }).then(() => {
                statusEl.innerText = "✅ ¡Registro guardado con éxito en Google Sheet!";
                statusEl.style.color = "#10B981";
            }).catch(() => { statusEl.innerText = "❌ Error al enviar datos."; statusEl.style.color = "#EF4444"; });
        }

        function restartGame() { showScreen('screen-welcome'); }
        function openQuestionEditor() {
            const container = document.getElementById('questions-list-editor'); container.innerHTML = '';
            questions.forEach((q, i) => {
                const div = document.createElement('div');
                div.innerHTML = `<label>Pregunta ${i + 1}:</label><input type="text" id="edit-q-${i}" value="${q.q}" style="width:100%;">`;
                container.appendChild(div);
            });
            document.getElementById('editor-modal').classList.add('active');
        }
        function closeQuestionEditor() { document.getElementById('editor-modal').classList.remove('active'); }
        function saveCustomQuestions() {
            questions.forEach((q, i) => { const v = document.getElementById(`edit-q-${i}`).value.trim(); if (v) q.q = v; });
            localStorage.setItem('custom_questions', JSON.stringify(questions)); closeQuestionEditor();
        }
        function resetDefaultQuestions() { localStorage.removeItem('custom_questions'); questions = baseQuestions; closeQuestionEditor(); }

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas'), ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const p = Array.from({length: 70}, () => ({ x: Math.random()*canvas.width, y: Math.random()*canvas.height - canvas.height, size: Math.random()*6+4, color: ['#6366F1','#10B981','#F59E0B','#EC4899'][Math.floor(Math.random()*4)], vy: Math.random()*3+2, vx: Math.random()*2-1 }));
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                p.forEach(particle => { particle.y += particle.vy; particle.x += particle.vx; ctx.fillStyle = particle.color; ctx.fillRect(particle.x, particle.y, particle.size, particle.size); });
                if (p.some(particle => particle.y < canvas.height)) requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
</body>
</html>
